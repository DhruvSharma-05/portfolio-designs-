<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG for browsers that take one; the 32px PNG is the fallback that
         stops anything else falling through to a /favicon.ico we don't ship -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta
      name="description"
      content="Photographer and web designer in Vancouver. Available light, clean grids, shipped end to end."
    />
    <title>Crafted &amp; Captured · Photography by Viraj</title>
    <link rel="canonical" href="https://craftedandcaptured.com/" />

    <!-- Open Graph / social. og:image must be an ABSOLUTE url. Swap og.svg
         for a 1200×630 PNG for full compatibility (FB/X don't render SVG). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crafted & Captured" />
    <meta property="og:url" content="https://craftedandcaptured.com/" />
    <meta property="og:title" content="Crafted & Captured · Photography by Viraj" />
    <meta property="og:description" content="Photographer and web designer in Vancouver. Available light, clean grids, shipped end to end." />
    <meta property="og:image" content="https://craftedandcaptured.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crafted & Captured · Photography by Viraj" />
    <meta name="twitter:description" content="Photographer and web designer in Vancouver. Available light, clean grids, shipped end to end." />
    <meta name="twitter:image" content="https://craftedandcaptured.com/og.png" />

    <!-- Structured data: helps Google understand who/what/where -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Crafted & Captured",
        "alternateName": "Lensofviraj",
        "description": "Photographer and web designer in Vancouver. Portraits, events and visual stories, plus web design and build.",
        "url": "https://craftedandcaptured.com",
        "image": "https://craftedandcaptured.com/og.png",
        "email": "craftedandcaptured@gmail.com",
        "telephone": "+1-672-968-9680",
        "priceRange": "$$",
        "founder": { "@type": "Person", "name": "Viraj Mehta", "jobTitle": "Photographer & Designer" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Vancouver",
          "addressRegion": "BC",
          "addressCountry": "CA"
        },
        "areaServed": { "@type": "City", "name": "Vancouver" },
        "knowsAbout": ["Photography", "Portrait Photography", "Event Photography", "Wildlife Photography", "Web Design", "UI/UX Design"],
        "sameAs": [
          "https://instagram.com/lensofviraj",
          "https://www.linkedin.com/in/virajmehtaa"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
